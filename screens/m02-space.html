@font-face { font-family: "Pretendard"; src: url("../fonts/PretendardVariable.woff2") format("woff2-variations"); font-weight: 45 920; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; background: #e9ebef; }
a { color: inherit; text-decoration: none; }
body { font-family: var(--font-family-primary, "Pretendard Variable", Pretendard, sans-serif); color: var(--color-text-primary); }
.screen { width: 375px; height: 812px; margin: 0 auto; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--color-bg-secondary); }

.screen__body { flex: 1; overflow: hidden; }

.screen--dark { background: var(--color-bg-inverse); }

.goal__head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--spacing-12); }
.goal__more { color: var(--color-text-tertiary); }
.goal ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--spacing-20); }
.goal li { display: flex; align-items: center; gap: var(--spacing-12); color: var(--color-gray-800); }
.goal li::before { content: ""; width: 6px; height: 6px; margin-left: 2px; border-radius: 50%; background: var(--color-blue-600); flex: none; }
.meta-box { display: flex; align-items: center; height: 72px; padding: 0 var(--spacing-16) 0 var(--spacing-24); }
.meta-box__item { flex: 1; display: flex; align-items: center; gap: var(--spacing-8); }
.meta-box__item svg.g { width: 28px; height: 28px; flex: none; }
.meta-box__txt { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.meta-box__label { color: var(--color-gray-800); }
.meta-box__chev { width: 16px; height: 16px; color: var(--color-gray-400); }
.meta-box__sep { width: 1px; height: 26px; background: var(--color-gray-300); margin: 0 var(--spacing-20); }
.sheet { background: var(--color-bg-surface); padding: 30px var(--spacing-screen-x) 0; flex: 1; }
.sec-title { display: flex; align-items: baseline; gap: 6px; margin-bottom: var(--spacing-16); }
.sec-title .n { color: var(--color-gray-600); }
.retro { display: flex; flex-direction: column; gap: 10px; padding: var(--spacing-20); background: var(--color-blue-50); border-radius: var(--radius-card); margin-bottom: var(--spacing-12); }
.retro__top { display: flex; gap: var(--spacing-4); }
.retro__info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--spacing-4); }
.retro__sub { color: var(--color-gray-800); }
.retro__date { display: flex; align-items: center; gap: var(--spacing-4); color: var(--color-text-tertiary); }
.retro__date .icon { width: 16px; height: 16px; }
.retro__side { display: flex; align-items: flex-start; gap: 1px; }
.retro__more { width: 24px; height: 24px; color: var(--color-gray-800); }
.retro__bottom { display: flex; justify-content: space-between; align-items: flex-end; }
.retro__count { display: flex; align-items: center; color: var(--color-text-tertiary); }
.retro__count svg { width: 24px; height: 24px; }
.retro__count b { color: var(--color-text-accent); font-weight: 500; }
