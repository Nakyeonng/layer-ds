<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Component — Scroll Bar</title>

<link rel="stylesheet" href="typography.css" />
<link rel="stylesheet" href="controls.css" />
<link rel="stylesheet" href="foundation-page.css" />
<style>
  .scroll { overflow-x: auto; max-width: 1300px; margin: 0 auto; border-radius: 32px; }
  .foundation.board { position: relative; width: 1300px; max-width: none; height: 1011px; padding: 64px 64px 0; overflow: hidden; }
  .heading { color: #212529; }
  .doc-lead { font-weight: 400; }
  .spec { position: absolute; margin: 0; }

  .lbl { color: rgba(6, 8, 12, 0.48); white-space: nowrap; }
  .sb { width: 10px; height: 280px; box-sizing: border-box; padding: 5px 3px; display: flex; flex-direction: column; }
  .sb span { width: 4px; height: 33.33%; border-radius: 99px; }
</style>
</head>
<body>
  <div class="scroll">
  <main class="foundation board">
    <header class="header">
      <div class="heading">
        <h1 class="doc-title">Scroll Bar</h1>
        <div class="doc-lead"><p>스크롤 바는 화면이나 목록의 내용이 넘칠 때 지금 위치를 보여 주는 요소입니다. 평소에는 옅게 보이다가 마우스를 올리면 한 단계, 끌고 있으면 두 단계 진해집니다. 막대 길이는 내용 길이에 따라 정해집니다.</p></div>
      </div>
      <hr class="divider" />
    </header>
<h2 class="doc-section spec" style="left:64px;top:342px">Scroll Bar</h2>
