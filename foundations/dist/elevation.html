<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Foundation — Elevation</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>/* typography.css */
/* ─────────────────────────────────────────────────────────────
   Typography — derived from Figma "Foundation / Typography" (node 1:3589)
   Values come only from that frame, not from the existing AI-made variables.

   Layer 1: primitives  (what values exist)
   Layer 2: text styles (which combinations are allowed)
   ───────────────────────────────────────────────────────────── */

:root {
  /* Family */
  --font-family-primary: "Pretendard", -apple-system, BlinkMacSystemFont,
    "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  /* Weight — 3 used */
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;

  /* Size — 9 used */
  --font-size-10: 10px;
  --font-size-11: 11px;
  --font-size-12: 12px;
  --font-size-14: 14px;
  --font-size-15: 15px;
  --font-size-16: 16px;
  --font-size-18: 18px;
  --font-size-20: 20px;
  --font-size-24: 24px;

  /* Line height — 2 used */
  --line-height-140: 1.4;
  --line-height-150: 1.5;

  /* Letter spacing — every style uses 0 */
  --letter-spacing-0: 0;
}

/* Shared base for every text style */
[class^="text-"], [class*=" text-"] {
  font-family: var(--font-family-primary);
  letter-spacing: var(--letter-spacing-0);
  font-feature-settings: "case" 1, "ss02" 1;
  margin: 0;
}

/* ── Text styles (15) ── name = Role / Size Weight, same as Figma ── */

/* Heading */
.text-heading-24-bold    { font-size: var(--font-size-24); font-weight: var(--font-weight-bold);     line-height: var(--line-height-150); }

/* Title */
.text-title-20-bold      { font-size: var(--font-size-20); font-weight: var(--font-weight-bold);     line-height: var(--line-height-140); }
.text-title-18-bold      { font-size: var(--font-size-18); font-weight: var(--font-weight-bold);     line-height: var(--line-height-140); } /* confirmed 140% (2026-10-26) */
.text-title-16-bold      { font-size: var(--font-size-16); font-weight: var(--font-weight-bold);     line-height: var(--line-height-140); }

/* Subtitle */
.text-subtitle-18-semibold { font-size: var(--font-size-18); font-weight: var(--font-weight-semibold); line-height: var(--line-height-140); }
.text-subtitle-16-semibold { font-size: var(--font-size-16); font-weight: var(--font-weight-semibold); line-height: var(--line-height-140); }
.text-subtitle-14-semibold { font-size: var(--font-size-14); font-weight: var(--font-weight-semibold); line-height: var(--line-height-140); }

/* Body */
.text-body-16-medium     { font-size: var(--font-size-16); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }
.text-body-15-medium     { font-size: var(--font-size-15); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }
.text-body-14-medium     { font-size: var(--font-size-14); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }
.text-body-12-semibold   { font-size: var(--font-size-12); font-weight: var(--font-weight-semibold); line-height: var(--line-height-140); }
.text-body-12-medium     { font-size: var(--font-size-12); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }

/* Caption */
.text-caption-11-medium  { font-size: var(--font-size-11); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }
.text-caption-10-bold    { font-size: var(--font-size-10); font-weight: var(--font-weight-bold);     line-height: var(--line-height-140); } /* confirmed 10px (2026-10-26) */
.text-caption-10-medium  { font-size: var(--font-size-10); font-weight: var(--font-weight-medium);   line-height: var(--line-height-140); }
</style>
<style>/* elevation.css */
/* ─────────────────────────────────────────────────────────────
   Elevation — derived from Figma "Foundation / Elevation" (node 1:4091)
   Values come only from that frame's effect styles Shadow/100–400.

   Layer 1: shadow levels  (what exists)
   Layer 2: usage aliases  (where each level is used, from the frame's labels)
   ───────────────────────────────────────────────────────────── */

:root {
  /* Every shadow is the same near-black, only the alpha changes */
  --shadow-color: 6 8 12;            /* #06080C as RGB channels */

  /* Levels — first shadow in each list is drawn on top */
  --shadow-100: 0 4px 12px 0 rgb(var(--shadow-color) / 0.04);
  --shadow-200: 0 4px 8px 0 rgb(var(--shadow-color) / 0.12),
                0 1px 4px 0 rgb(var(--shadow-color) / 0.08);
  --shadow-300: 0 4px 12px 0 rgb(var(--shadow-color) / 0.12),
                0 4px 8px 0 rgb(var(--shadow-color) / 0.08);
  --shadow-400: 0 4px 12px 0 rgb(var(--shadow-color) / 0.22),
                0 4px 8px 0 rgb(var(--shadow-color) / 0.08);

  /* Usage — name the job, not the strength */
  --shadow-card: var(--shadow-100);
  --shadow-floating-button: var(--shadow-200);
  --shadow-layer: var(--shadow-300);
  --shadow-modal: var(--shadow-400);        /* modal and bottom sheet */
}

.elevation-100 { box-shadow: var(--shadow-100); }
.elevation-200 { box-shadow: var(--shadow-200); }
.elevation-300 { box-shadow: var(--shadow-300); }
.elevation-400 { box-shadow: var(--shadow-400); }
</style>
<style>/* foundation-page.css */
/* ─────────────────────────────────────────────────────────────
   Shared layout for Foundation doc pages (Color, Typography, Elevation…).
   Doc-site only: these values are not design tokens.
   ───────────────────────────────────────────────────────────── */

:root {
  --page-bg: #edf0f4;
  --surface: #ffffff;
  --surface-muted: #f2f4f8;
  --ink: #212329;
  --ink-strong: #06080c;
  --ink-muted: rgba(6, 8, 12, 0.48);
  --rule: #edf0f4;
}

* { box-sizing: border-box; }
body {
  margin: 0; padding: 40px 16px;
  background: var(--page-bg); color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

/* Frame: 64px side padding, 32px radius */
.foundation {
  max-width: 1280px; margin: 0 auto;
  background: var(--surface); border-radius: 32px; overflow: clip;
  padding: 64px 64px 168px;
}

/* Header */
.header { display: flex; flex-direction: column; gap: 32px; padding-bottom: 64px; }
.heading { display: flex; flex-direction: column; gap: 18px; }
.divider { border: 0; border-top: 1px solid var(--rule); margin: 0; }

/* Doc-only type: used on doc pages, not part of the 15 text styles */
.doc-title, .doc-lead, .doc-section { font-family: var(--font-family-primary); margin: 0; }
.doc-title   { font-weight: 700; font-size: 56px; line-height: 86px; letter-spacing: -0.5px; font-feature-settings: "ss02" 1, "case" 1; }
.doc-lead    { font-weight: 500; font-size: 18px; line-height: 1.5; letter-spacing: -0.18px; min-height: 54px; font-feature-settings: "case" 1, "ss02" 1; }
.doc-lead p  { margin: 0; }
.doc-section { font-weight: 700; font-size: 24px; line-height: 1.3; letter-spacing: -0.24px; font-feature-settings: "ss10" 1; }

/* First section sits 23px under the header */
.section { margin-top: 23px; }

@media (max-width: 900px) {
  .foundation { padding: 40px 24px 80px; border-radius: 24px; }
  .doc-title { font-size: 40px; line-height: 60px; }
}
</style>
<style>
  /* Stage: muted panel the sample cards sit on */
  .stage {
    margin-top: 24px;
    min-height: 520px;
    background: var(--surface-muted);
    border-radius: 20px;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
  }
  .levels {
    display: grid;
    grid-template-columns: repeat(4, 190px);
    gap: 30px;
    margin: 0; padding: 0; list-style: none;
  }
  .level { display: flex; flex-direction: column; gap: 32px; }
  .sample {
    width: 190px; height: 180px;
    background: var(--surface);
    border-radius: 12px;
  }
  .caption { display: flex; flex-direction: column; gap: 8px; }
  .caption .name { color: var(--ink-strong); }
  .caption .use  { color: var(--ink-muted); }

  @media (max-width: 960px) {
    .levels { grid-template-columns: repeat(2, 190px); row-gap: 48px; }
  }
  @media (max-width: 480px) {
    .levels { grid-template-columns: 1fr; }
    .sample { width: 100%; }
  }
</style>
</head>
<body>
  <main class="foundation">
    <header class="header">
      <div class="heading">
        <h1 class="doc-title">Elevation</h1>
        <div class="doc-lead"><p>Icons에 대한 설명 작성</p></div>
      </div>
      <hr class="divider" />
    </header>

    <section class="section">
      <h2 class="doc-section">Shadow Styles</h2>
      <div class="stage">
        <ul class="levels">
          <li class="level">
            <div class="sample elevation-100" aria-hidden="true"></div>
            <div class="caption">
              <p class="name text-subtitle-16-semibold">Shadow 100</p>
              <p class="use text-body-16-medium">Card</p>
            </div>
          </li>
          <li class="level">
            <div class="sample elevation-200" aria-hidden="true"></div>
            <div class="caption">
              <p class="name text-subtitle-16-semibold">Shadow 200</p>
              <p class="use text-body-16-medium">Floating Button</p>
            </div>
          </li>
          <li class="level">
            <div class="sample elevation-300" aria-hidden="true"></div>
            <div class="caption">
              <p class="name text-subtitle-16-semibold">Shadow 300</p>
              <p class="use text-body-16-medium">Layer</p>
            </div>
          </li>
          <li class="level">
            <div class="sample elevation-400" aria-hidden="true"></div>
            <div class="caption">
              <p class="name text-subtitle-16-semibold">Shadow 400</p>
              <p class="use text-body-16-medium">Modal/Bottom Sheet</p>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>
</body>
</html>
